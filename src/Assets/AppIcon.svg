<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C4E80"/>
      <stop offset="100%" stop-color="#0B3A63"/>
    </linearGradient>
    <linearGradient id="front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#50B0F0"/>
      <stop offset="55%" stop-color="#2A93E0"/>
      <stop offset="100%" stop-color="#0F6CBD"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="badgeGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#3AD0FF"/>
      <stop offset="100%" stop-color="#0A78C2"/>
    </radialGradient>

    <filter id="dropShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <filter id="dropShadowSmall" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Hintere, dunklere Fluent-Kachel: leicht gedreht und versetzt (kein Vollbild-Quadrat wie bei iOS) -->
  <g transform="rotate(-8 128 128)">
    <rect x="46" y="46" width="150" height="150" rx="34" fill="url(#back)" filter="url(#dropShadow)"/>
  </g>

  <!-- Vordere, hellere Fluent-Kachel -->
  <g transform="rotate(4 128 128) translate(6 -4)">
    <rect x="46" y="46" width="150" height="150" rx="34" fill="url(#front)"/>
    <rect x="46" y="46" width="150" height="76" rx="34" fill="url(#sheen)"/>
    <rect x="46" y="46" width="150" height="150" rx="34" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>

    <!-- Monitor-Glyph -->
    <g transform="translate(74,78)">
      <rect x="0" y="0" width="94" height="64" rx="8" fill="#FFFFFF"/>
      <rect x="0" y="0" width="94" height="64" rx="8" fill="none" stroke="#0B3A63" stroke-opacity="0.12" stroke-width="2"/>
      <rect x="38" y="64" width="18" height="12" rx="3" fill="#FFFFFF"/>
      <rect x="24" y="76" width="46" height="8" rx="4" fill="#FFFFFF"/>

      <!-- Ausblendende Desktop-Icons -->
      <rect x="12" y="12" width="14" height="14" rx="3" fill="#2A93E0" opacity="1.0"/>
      <rect x="12" y="32" width="14" height="14" rx="3" fill="#2A93E0" opacity="0.5"/>
      <rect x="12" y="44" width="14" height="14" rx="3" fill="#2A93E0" opacity="0.18"/>
    </g>
  </g>

  <!-- Kleines, freischwebendes Badge unten rechts (typisch Fluent: eigenständige Form mit eigenem Schatten) -->
  <g filter="url(#dropShadowSmall)">
    <circle cx="192" cy="190" r="38" fill="url(#badgeGrad)"/>
  </g>
  <g transform="translate(192,190)">
    <path d="M -20 0 C -12 -13, 12 -13, 20 0 C 12 13, -12 13, -20 0 Z" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>
    <circle cx="0" cy="0" r="6.5" fill="#FFFFFF"/>
    <line x1="-16" y1="13" x2="16" y2="-13" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round"/>
  </g>
</svg>
