<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A96DD"/>
      <stop offset="55%" stop-color="#0F6CBD"/>
      <stop offset="100%" stop-color="#0B4F8A"/>
    </linearGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EAF4FF"/>
    </linearGradient>
  </defs>

  <!-- Fluent app tile background -->
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="118" rx="52" fill="url(#glass)"/>

  <!-- Monitor -->
  <rect x="60" y="66" width="136" height="92" rx="10" fill="url(#screen)"/>
  <rect x="60" y="66" width="136" height="92" rx="10" fill="none" stroke="#0B4F8A" stroke-opacity="0.15" stroke-width="2"/>
  <!-- monitor stand -->
  <rect x="118" y="158" width="20" height="16" rx="3" fill="#EAF4FF"/>
  <rect x="100" y="174" width="56" height="10" rx="5" fill="#EAF4FF"/>

  <!-- Desktop icons fading out (the "auto hide" concept) -->
  <g>
    <rect x="80" y="86" width="18" height="18" rx="4" fill="#0F6CBD" opacity="1.0"/>
    <rect x="80" y="112" width="18" height="18" rx="4" fill="#0F6CBD" opacity="0.55"/>
    <rect x="80" y="138" width="18" height="18" rx="4" fill="#0F6CBD" opacity="0.18"/>
  </g>

  <!-- Eye / visibility glyph, Fluent line style, indicating "hide" -->
  <g transform="translate(150,96)">
    <path d="M0 22 C 10 4, 40 4, 50 22 C 40 40, 10 40, 0 22 Z" fill="none" stroke="#0F6CBD" stroke-width="5" stroke-linejoin="round"/>
    <circle cx="25" cy="22" r="9" fill="#0F6CBD"/>
    <line x1="-4" y1="40" x2="54" y2="4" stroke="#0F6CBD" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Bottom accent bar, subtle -->
  <rect x="8" y="206" width="240" height="42" rx="0" fill="#000000" opacity="0.06"/>
</svg>
