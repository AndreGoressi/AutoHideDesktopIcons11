name: Build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, win-x86, win-arm64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET 8 SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/AutoHideDesktopIcons11.csproj -r ${{ matrix.rid }}

      - name: Publish (portable, self-contained, unpackaged)
        run: >
          dotnet publish src/AutoHideDesktopIcons11.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:WindowsAppSDKSelfContained=true
          -p:PublishSingleFile=false
          -o publish/${{ matrix.rid }}

      - name: ZIP zum Mitnehmen packen
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version.StartsWith("v")) { $version = "dev" }
          $zipName = "AutoHideDesktopIcons11-$version-${{ matrix.rid }}.zip"
          Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Als Build-Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AutoHideDesktopIcons11-${{ matrix.rid }}
          path: ${{ env.ZIP_NAME }}

      - name: An GitHub Release anhängen (nur bei Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
